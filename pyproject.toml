[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented Python platform promises"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "platform-claim-audit contributors"}]
dependencies = []

[project.scripts]
platform-claim-audit = "platform_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
